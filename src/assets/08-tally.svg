		<rect id="body-edge" x="20" y="108" width="560" height="764" rx="30" fill="url(#edge-shade)" />
		<rect id="printer-cover" x="44" y="128" width="512" height="186" rx="14" fill="#f2f1ec" stroke="#d6d3ca" stroke-width="2" />
		<rect id="paper-exit" x="218" y="150" width="164" height="24" rx="4" fill="#cdcac0" />
		<rect id="window-bezel" x="203" y="173" width="194" height="78" rx="8" fill="#d9d6cd" />
