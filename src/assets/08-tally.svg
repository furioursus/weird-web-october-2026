		<rect id="vfd" x="64" y="372" width="360" height="74" rx="5" fill="#040506" stroke="#26282b" stroke-width="2" />
		<rect id="display-gloss" x="20" y="326" width="560" height="190" fill="url(#glass-shine)" />
		<text id="brand" x="548" y="436" text-anchor="end" fill="#ecebe8" font-family="Oswald" font-weight="700" font-size="28" letter-spacing="4">TALLY</text>
		<text id="model" x="548" y="456" text-anchor="end" fill="#bdbcb7" font-family="Oswald" font-size="12" letter-spacing="1">TL-808P</text>
