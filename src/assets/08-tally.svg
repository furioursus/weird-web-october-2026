<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880">
	<defs>
		<linearGradient id="roll-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#d4d0c4" />
			<stop offset="0.3" stop-color="#f7f5ef" />
			<stop offset="0.5" stop-color="#ffffff" />
			<stop offset="0.75" stop-color="#eeebe2" />
			<stop offset="1" stop-color="#c9c4b6" />
		</linearGradient>
		<linearGradient id="body-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f1f0eb" />
			<stop offset="0.55" stop-color="#e6e5df" />
			<stop offset="1" stop-color="#d6d4cc" />
		</linearGradient>
		<linearGradient id="glass-shine" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
			<stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03" />
			<stop offset="0.46" stop-color="#ffffff" stop-opacity="0" />
		</linearGradient>
		<linearGradient id="edge-shade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#000000" stop-opacity="0" />
			<stop offset="0.955" stop-color="#000000" stop-opacity="0" />
			<stop offset="0.985" stop-color="#000000" stop-opacity="0.1" />
			<stop offset="1" stop-color="#000000" stop-opacity="0.2" />
		</linearGradient>
	</defs>

	<g id="roll-holder" fill="none" stroke="#a9a59b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
		<path d="M212 112V62H222" />
		<path d="M388 112V62H378" />
		<path d="M206 66C184 66 184 96 206 96" />
	</g>
	<g id="roll">
