		<rect id="roll-end-left" x="213" y="54" width="9" height="42" rx="3" fill="#8b877c" />
		<rect id="roll-end-right" x="378" y="54" width="9" height="42" rx="3" fill="#8b877c" />
	</g>

	<g id="body">
